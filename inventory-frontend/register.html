<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register · Inventory System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">

    <div class="grid-bg"></div>
    <div class="glow-1"></div>
    <div class="glow-2"></div>

    <div class="auth-card">
        <div class="logo">Inventory<span>System</span></div>
        <div class="auth-tagline">Stock Intelligence Platform</div>

        <h2>Create account</h2>
        <p class="auth-subtext">Set up your workspace in seconds</p>

        <div class="auth-inputs">
            <div>
                <label class="input-field-label">Username</label>
                <input id="username" type="text" placeholder="Min. 3 characters" maxlength="30" onkeydown="if(event.key==='Enter') register()">
            </div>
            <div>
                <label class="input-field-label">Password</label>
                <input id="password" type="password" placeholder="Min. 6 characters" maxlength="64" onkeydown="if(event.key==='Enter') register()">
            </div>
            <div class="auth-error" id="reg-error"></div>
            <button class="auth-btn" id="reg-btn" onclick="register()">Create Account →</button>
        </div>

        <div class="auth-link">
            Already have an account? <a href="login.html">Sign in</a>
        </div>
    </div>

    <script>
    function register() {
        const u     = document.getElementById("username").value.trim();
        const p     = document.getElementById("password").value;
        const errEl = document.getElementById("reg-error");
        const btn   = document.getElementById("reg-btn");

        errEl.style.display = "none";

        if (!u || !p) {
            errEl.textContent = "Please fill in all fields.";
            errEl.style.display = "block"; return;
        }
        if (u.length < 3) {
            errEl.textContent = "Username must be at least 3 characters.";
            errEl.style.display = "block"; return;
        }
        if (p.length < 6) {
            errEl.textContent = "Password must be at least 6 characters.";
            errEl.style.display = "block"; return;
        }

        btn.textContent = "Creating account…";
        btn.disabled = true;

        fetch("http://localhost:8080/auth/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: u, password: p })
        })
        .then(async res => {
            if (res.ok) {
                alert("Account created! Please log in.");
                window.location.href = "login.html";
            } else {
                const data = await res.json().catch(() => ({}));
                errEl.textContent = data.message || "Registration failed. Username might be taken.";
                errEl.style.display = "block";
                btn.textContent = "Create Account →";
                btn.disabled = false;
            }
        })
        .catch(() => {
            errEl.textContent = "Cannot connect to server.";
            errEl.style.display = "block";
            btn.textContent = "Create Account →";
            btn.disabled = false;
        });
    }
    </script>
</body>
</html>
